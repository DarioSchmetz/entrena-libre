
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

<body>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💪 Entrena Libre</title>
    <link rel="stylesheet" href="style.css">
</head>
<main>
    <div class="card">
        <h2>¿Listo para mover el cuerpo hoy?</h2>
        <p>Personalizá tu entrenamiento al instante.</p>
        
        <div class="form-group" style="margin-bottom: 1rem; text-align: left;">
            <label for="nivel" style="display:block; font-weight:bold; margin-bottom:0.25rem;">Nivel:</label>
            <select id="nivel" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc; margin-bottom: 0.75rem;">
                <option value="todos">Cualquier nivel</option>
                <option value="principiante">Principiante</option>
                <option value="intermedio">Intermedio</option>
            </select>

            <label for="zona" style="display:block; font-weight:bold; margin-bottom:0.25rem;">Zona muscular:</label>
            <select id="zona" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc;">
                <option value="todas">Cuerpo completo (Full Body)</option>
                <option value="piernas">Piernas</option>
                <option value="core">Core / Abdomen</option>
                <option value="brazos">Brazos y Pecho</option>
            </select>
        </div>

        <button class="btn" id="btn-generar">Buscar Rutina</button>
    </div>

    <div id="resultado-rutina"></div>

    <div class="card ad-space">
        <p>[ Espacio publicitario web ]</p>
    </div>
</main>

</body>
</html>
